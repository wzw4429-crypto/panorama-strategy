name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # TypeScript 编译：src/*.ts 为唯一真源，emit 出 src/*.js 后再打包
      - name: Build TypeScript
        run: |
          npx -y -p typescript@5.6.3 tsc -p tsconfig.json
          echo "---- emit 产物 ----"
          ls -la src/*.js | head -20

      # 固定签名：从 Secret 解码密钥库（PKCS#12），密码走环境变量
      - name: Decode signing keystore
        env:
          PANORAMA_KEYSTORE_B64: ${{ secrets.PANORAMA_KEYSTORE_B64 }}
          PANORAMA_KEYSTORE_PASSWORD: ${{ secrets.PANORAMA_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$PANORAMA_KEYSTORE_B64" ]; then
            echo "::error::缺少 secret PANORAMA_KEYSTORE_B64（固定签名密钥库 base64）"
            exit 1
          fi
          echo "$PANORAMA_KEYSTORE_B64" | base64 -d > android/app/pse-release.p12
          ls -la android/app/pse-release.p12
          echo "密钥库大小校验通过"

      # 游戏 web 资源打进 APK assets（以仓库内 src/ data/ 为唯一真源，避免副本漂移）
      - name: Prepare web assets
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -r index.html src data android/app/src/main/assets/www/
          du -sh android/app/src/main/assets/www

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure Android SDK packages
        shell: bash
        run: |
          SM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses >/dev/null 2>&1 || true
            "$SM" "platforms;android-34" "build-tools;34.0.0" >/dev/null || true
          fi

      # release 构建 + 固定签名（老版本可直接覆盖安装升级）
      - name: Build signed release APK
        env:
          PANORAMA_KEYSTORE_PASSWORD: ${{ secrets.PANORAMA_KEYSTORE_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon

      - name: Verify signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/34.0.0/apksigner 2>/dev/null || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" | head -5
          fi

      - name: Package artifact
        run: cp android/app/build/outputs/apk/release/app-release.apk panorama-strategy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: panorama-strategy-apk
          path: panorama-strategy.apk
