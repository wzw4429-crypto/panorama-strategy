plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pse.panorama'
    compileSdk 34

    defaultConfig {
        applicationId "com.pse.panorama"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    // —— 固定签名 ——
    // 密钥库文件 pse-release.p12（PKCS#12，RSA 2048，有效期 10000 天，别名 pse）。
    // 该文件不提交仓库；CI 从 GitHub Secret（PANORAMA_KEYSTORE_B64）解码注入，
    // 密码走环境变量 PANORAMA_KEYSTORE_PASSWORD。本地构建时把 p12 放到 app/ 目录即可自动签名。
    def ksFile = file("pse-release.p12")
    def ksPass = System.getenv("PANORAMA_KEYSTORE_PASSWORD") ?: (project.findProperty("panoramaStorePassword") ?: "")
    def keyPass = System.getenv("PANORAMA_KEY_PASSWORD") ?: ksPass
    def keyAlias = System.getenv("PANORAMA_KEY_ALIAS") ?: "pse"

    signingConfigs {
        release {
            if (ksFile.exists() && ksPass) {
                storeFile ksFile
                storePassword ksPass
                keyAlias keyAlias
                keyPassword keyPass
                storeType "PKCS12"
            }
        }
    }

    buildTypes {
        debug {
            // 调试签名即可安装（侧载），保持构建最快
        }
        release {
            minifyEnabled false
            if (ksFile.exists() && ksPass) {
                signingConfig signingConfigs.release
            }
            // 无密钥库时产出未签名 release（CI 必带密钥库，不会走到）
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
